# Host Nginx for the EC2 deployment, behind the Cloudflare proxy.
# Port 443 uses a Cloudflare Origin CA certificate (SSL mode "Full (strict)").
# The certificate and key live only on the VM, in /etc/cloudflare/, and are
# never committed. Port 80 keeps serving the app (no redirect): Cloudflare's
# "Always Use HTTPS" handles that, and a redirect here would loop while the
# SSL mode is still "Flexible".
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/cloudflare/origin-ca.crt;
  ssl_certificate_key /etc/cloudflare/origin-ca.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  server_tokens off;
  client_max_body_size 10m;

  # The API does not compress: MVT tiles shrink 3-6x with gzip
  # (the z3 UC tile goes from ~370 KB to ~64 KB).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/vnd.mapbox-vector-tile application/x-protobuf;

  location /api {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
