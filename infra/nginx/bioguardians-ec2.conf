# Host Nginx for the EC2 deployment. TLS can be added after DNS is configured.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  server_tokens off;
  client_max_body_size 10m;

  # The API does not compress: MVT tiles shrink 3-6x with gzip
  # (the z3 UC tile goes from ~370 KB to ~64 KB).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/vnd.mapbox-vector-tile application/x-protobuf;

  location /api {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
