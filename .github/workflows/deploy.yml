name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve image names and release tag
        id: vars
        run: |
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo_lower=$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=$REGISTRY/$owner_lower/$repo_lower" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Detect changed services
        id: changes
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD || true)
          if [ -z "$changed" ]; then
            backend=true
            frontend=true
          else
            echo "$changed" | grep -qE '^(backend/|db/)' && backend=true || backend=false
            echo "$changed" | grep -qE '^(frontend/|stack\.yml|infra/nginx/|otel-collector-config\.yaml|observability/|docker-compose\.ec2-observability\.yml)' && frontend=true || frontend=false
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Validate sequential MySQL migrations
        run: |
          cd db/migrations
          files=$(ls -1 [0-9][0-9][0-9]_*.sql 2>/dev/null | sort)
          [ -n "$files" ] || { echo "ERROR: no migration files found"; exit 1; }
          previous=0
          for file in $files; do
            number=$(echo "$file" | sed -E 's/^0*([0-9]+)_.*/\1/')
            [ "$number" -gt 0 ] 2>/dev/null || { echo "ERROR: invalid migration: $file"; exit 1; }
            [ "$number" -eq "$((previous + 1))" ] || {
              echo "ERROR: migration numbers are not sequential at $file"
              exit 1
            }
            previous=$number
          done
          echo "Validated $previous sequential migrations."

      - name: Build image matrix
        id: matrix
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
        run: |
          matrix=$(jq -cn \
            --argjson frontend "$FRONTEND_CHANGED" \
            --argjson backend "$BACKEND_CHANGED" '[
              {"service":"frontend","context":"./frontend","dockerfile":"frontend/Dockerfile","should_build":$frontend},
              {"service":"backend","context":"./backend","dockerfile":"backend/Dockerfile","should_build":$backend}
            ]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare frontend build arguments
        if: ${{ matrix.service == 'frontend' && matrix.should_build }}
        id: args
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
        run: |
          [ -n "$VITE_MAPTILER_API_KEY" ] || {
            echo "Missing secret VITE_MAPTILER_API_KEY"
            exit 1
          }
          {
            echo 'value<<EOF'
            printf 'VITE_API_URL=%s\n' "$VITE_API_URL"
            printf 'VITE_MAPTILER_API_KEY=%s\n' "$VITE_MAPTILER_API_KEY"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }} image
        if: ${{ matrix.should_build }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ${{ needs.prepare.outputs.image }}-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.image }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Tag unchanged image with this release
        if: ${{ !matrix.should_build }}
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker pull "$IMAGE-$SERVICE:latest"
          docker tag "$IMAGE-$SERVICE:latest" "$IMAGE-$SERVICE:$TAG"
          docker push "$IMAGE-$SERVICE:$TAG"

  migrate:
    name: Deploy migrations
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare MySQL deployment environment
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || secrets.FRONTEND_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          required = [
              "IMAGE", "IMAGE_TAG", "DB_ROOT_PASSWORD", "DB_USER",
              "DB_PASSWORD", "DB_NAME", "FRONTEND_URL",
              "GRAFANA_ADMIN_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.exit("Missing GitHub secret/variable(s): " + ", ".join(missing))

          for name in ("DB_ROOT_PASSWORD", "DB_PASSWORD", "GRAFANA_ADMIN_PASSWORD"):
              if not re.fullmatch(r"[A-Fa-f0-9]{64}", os.environ[name]):
                  sys.exit(f"{name} must be a 64-character hex password (openssl rand -hex 32).")
          for name in ("DB_USER", "DB_NAME"):
              if not re.fullmatch(r"[A-Za-z0-9_]{1,64}", os.environ[name]):
                  sys.exit(f"{name} may contain only letters, numbers and underscores.")
          frontend_url = os.environ["FRONTEND_URL"]
          if not re.fullmatch(r"https?://[^\s$]+", frontend_url) or frontend_url.endswith("/"):
              sys.exit("FRONTEND_URL must be an http:// or https:// origin without a trailing slash.")

          with open("deploy.env", "w", encoding="utf-8") as env_file:
              for name in required:
                  env_file.write(f"{name}={os.environ[name]}\n")
              env_file.write("DB_POOL_MAX=10\nCACHE_MAX=100\nCACHE_TTL_MS=30000\n")
          os.chmod("deploy.env", 0o600)
          PY

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          [ -n "$EC2_SSH_KEY" ] || { echo "Missing secret EC2_SSH_KEY"; exit 1; }
          [ -n "$EC2_SSH_HOST" ] || { echo "Missing secret EC2_SSH_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_deploy_key"
          chmod 600 "$RUNNER_TEMP/ec2_deploy_key"
          ssh-keyscan -p "$EC2_SSH_PORT" -H "$EC2_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy database and Compose files to EC2
        env:
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
            "$EC2_SSH_USER@$EC2_SSH_HOST" \
            'mkdir -p ~/bioguardians/db'
          scp -i "$RUNNER_TEMP/ec2_deploy_key" -P "$EC2_SSH_PORT" \
            deploy.env stack.yml \
            "$EC2_SSH_USER@$EC2_SSH_HOST:~/bioguardians/"
          scp -i "$RUNNER_TEMP/ec2_deploy_key" -P "$EC2_SSH_PORT" -r \
            db/. "$EC2_SSH_USER@$EC2_SSH_HOST:~/bioguardians/db/"

      - name: Start MySQL on EC2
        env:
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
            "$EC2_SSH_USER@$EC2_SSH_HOST" \
            'chmod 600 ~/bioguardians/deploy.env && \
             mv ~/bioguardians/deploy.env ~/bioguardians/.env && \
             cd ~/bioguardians && \
             sudo docker compose --env-file .env -f stack.yml up -d db'

      - name: Apply MySQL migrations
        env:
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
            "$EC2_SSH_USER@$EC2_SSH_HOST" \
            'cd ~/bioguardians && \
             sudo docker compose --env-file .env -f stack.yml run --rm migrate'

  generate-stack:
    name: Generate stack
    runs-on: ubuntu-latest
    needs: [prepare, migrate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Generate release Compose stack
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          release = Path("release")
          (release / "observability").mkdir(parents=True, exist_ok=True)
          (release / "infra" / "nginx").mkdir(parents=True, exist_ok=True)

          stack = Path("stack.yml").read_text(encoding="utf-8")
          stack = stack.replace("${IMAGE:?IMAGE is required}", os.environ["IMAGE"])
          stack = stack.replace("${IMAGE_TAG:?IMAGE_TAG is required}", os.environ["IMAGE_TAG"])
          (release / "stack.yml").write_text(stack, encoding="utf-8")
          PY
          cp docker-compose.ec2-observability.yml otel-collector-config.yaml release/
          cp -R observability/. release/observability/
          cp infra/nginx/bioguardians-ec2.conf release/infra/nginx/

      - name: Upload release stack
        uses: actions/upload-artifact@v4
        with:
          name: release-stack-${{ needs.prepare.outputs.tag }}
          path: release/
          retention-days: 1

  deploy:
    name: Deploy on VM
    runs-on: ubuntu-latest
    needs: [prepare, generate-stack]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download release stack
        uses: actions/download-artifact@v4
        with:
          name: release-stack-${{ needs.prepare.outputs.tag }}
          path: release

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          [ -n "$EC2_SSH_KEY" ] || { echo "Missing secret EC2_SSH_KEY"; exit 1; }
          [ -n "$EC2_SSH_HOST" ] || { echo "Missing secret EC2_SSH_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_deploy_key"
          chmod 600 "$RUNNER_TEMP/ec2_deploy_key"
          ssh-keyscan -p "$EC2_SSH_PORT" -H "$EC2_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy generated stack to EC2
        env:
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
            "$EC2_SSH_USER@$EC2_SSH_HOST" \
            'mkdir -p ~/bioguardians/observability ~/bioguardians/infra/nginx'
          scp -i "$RUNNER_TEMP/ec2_deploy_key" -P "$EC2_SSH_PORT" \
            release/stack.yml release/docker-compose.ec2-observability.yml \
            release/otel-collector-config.yaml \
            "$EC2_SSH_USER@$EC2_SSH_HOST:~/bioguardians/"
          scp -i "$RUNNER_TEMP/ec2_deploy_key" -P "$EC2_SSH_PORT" -r \
            release/observability/. \
            "$EC2_SSH_USER@$EC2_SSH_HOST:~/bioguardians/observability/"
          scp -i "$RUNNER_TEMP/ec2_deploy_key" -P "$EC2_SSH_PORT" \
            release/infra/nginx/bioguardians-ec2.conf \
            "$EC2_SSH_USER@$EC2_SSH_HOST:~/bioguardians/infra/nginx/"

      - name: Deploy containers and configure host Nginx
        env:
          EC2_SSH_HOST: ${{ secrets.EC2_SSH_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if ! [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "GHCR_USERNAME must contain only letters, numbers and hyphens."
            exit 1
          fi
          auth_dir="/tmp/bioguardians-ghcr-$GITHUB_RUN_ID"
          cleanup_deploy() {
            ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
              "$EC2_SSH_USER@$EC2_SSH_HOST" "sudo rm -rf '$auth_dir'" >/dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/ec2_deploy_key"
          }
          trap cleanup_deploy EXIT
          ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
            "$EC2_SSH_USER@$EC2_SSH_HOST" "sudo install -d -m 0700 '$auth_dir'"

          if [ -n "$GHCR_READ_TOKEN" ]; then
            printf '%s' "$GHCR_READ_TOKEN" | ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
              "$EC2_SSH_USER@$EC2_SSH_HOST" \
              "sudo docker --config '$auth_dir' login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          fi

          ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
            "$EC2_SSH_USER@$EC2_SSH_HOST" \
            'chmod 600 ~/bioguardians/.env && \
             sudo install -m 0644 ~/bioguardians/infra/nginx/bioguardians-ec2.conf /etc/nginx/sites-available/bioguardians && \
             sudo rm -f /etc/nginx/sites-enabled/default && \
             sudo ln -sfn /etc/nginx/sites-available/bioguardians /etc/nginx/sites-enabled/bioguardians && \
             sudo nginx -t && sudo systemctl reload nginx && \
             cd ~/bioguardians && \
             sudo docker --config '"$auth_dir"' compose --env-file .env -f stack.yml pull backend frontend && \
             sudo docker --config '"$auth_dir"' compose --env-file .env -f stack.yml up -d backend frontend'

          if [ -n "$GHCR_READ_TOKEN" ]; then
            ssh -i "$RUNNER_TEMP/ec2_deploy_key" -p "$EC2_SSH_PORT" \
              "$EC2_SSH_USER@$EC2_SSH_HOST" \
              "sudo docker --config '$auth_dir' logout ghcr.io"
          fi
