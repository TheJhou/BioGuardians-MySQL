name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Ephemeral database that only lives inside the job: fixed credentials, no secrets.
env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: bioguard_ci
  DB_PASSWORD: bioguard_ci
  DB_NAME: bioguardians_ci

jobs:
  validate:
    name: Validate schema (ephemeral)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_USER: bioguard_ci
          MYSQL_PASSWORD: bioguard_ci
          MYSQL_DATABASE: bioguardians_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_ci --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Service containers can't receive mysqld flags; without this, a
      # non-SUPER user can't create triggers while binary logging is on.
      - name: Allow trigger creation
        run: mysql -h 127.0.0.1 -uroot -proot_ci -e "SET PERSIST log_bin_trust_function_creators = 1;"

      - name: Run migrations (ephemeral)
        run: bash db/migrate.sh

      - name: Run smoke tests (ephemeral)
        run: mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < db/tests/smoke_test.sql

      - name: Verify migration idempotency
        run: bash db/migrate.sh

  backend-typecheck:
    name: Typecheck backend
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

  frontend-typecheck:
    name: Typecheck frontend
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
