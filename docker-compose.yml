services:
  # ---------- Database (MySQL 8.4 LTS) ----------
  db:
    image: mysql:8.4
    container_name: bioguardians-db
    restart: unless-stopped
    # log-bin-trust-function-creators: lets the app user create triggers
    # while binary logging is on (it is on by default in 8.4).
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_as_cs
      --default-time-zone=+00:00
      --innodb-buffer-pool-size=2G
      --max-connections=100
      --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required, copy .env.example to .env}
      MYSQL_USER: ${DB_USER:?DB_USER is required, copy .env.example to .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required, copy .env.example to .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - bioguardians_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4"

  # ---------- Migration runner (one-shot) ----------
  migrate:
    image: mysql:8.4
    container_name: bioguardians-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
    volumes:
      - ./db:/db:ro
    entrypoint: ["bash", "/db/migrate.sh"]
    restart: "no"

  # ---------- Backend API (Node.js + Express) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bioguardians-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      CACHE_MAX: ${CACHE_MAX:-500}
      GBIF_API_BASE: https://api.gbif.org/v1
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend/src:/app/src:ro
    command: ["npx", "tsx", "watch", "src/index.ts"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

  # ---------- Frontend (React + Vite dev server) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bioguardians-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
      VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:?VITE_MAPTILER_API_KEY is required}
    ports:
      - "5173:80"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  # ---------- ML Service (Python + FastAPI + VLM, GPU) ----------
  # Runs locally with NVIDIA RTX 4060 via Docker Desktop + WSL2.
  # Classifies camera trap images using Qwen2-VL (local) or OpenRouter (fallback).
  # NOT deployed to the Oracle VM — runs on the local GPU machine only.
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: bioguardians-ml
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      LOCAL_VLM_ENABLED: ${LOCAL_VLM_ENABLED:-true}
      LOCAL_VLM_PATH: ${LOCAL_VLM_PATH:-models/qwen2vl-finetuned}
      YOLO_DEVICE: ${YOLO_DEVICE:-cuda}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-120}
      VLM_CONCURRENCY: ${VLM_CONCURRENCY:-8}
      IMAGE_STORAGE_DIR: /app/images
      WI_EMAIL: ${WI_EMAIL:-}
      WI_PASSWORD: ${WI_PASSWORD:-}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Camera trap datasets (read-only)
      - ./dados:/data:ro
      # Persisted downloaded images
      - bioguardians_ml_images:/app/images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  bioguardians_mysqldata:
  bioguardians_ml_images:
