# BioGuardians production stack for an EC2 VM.
# MySQL stays on the private Compose network; only the host Nginx can reach
# the frontend and backend through loopback bindings.
services:
  db:
    image: mysql:8.4
    container_name: bioguardians-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=512M
      - --max-connections=60
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - bioguardians_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bioguardians-network
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2"

  migrate:
    image: mysql:8.4
    container_name: bioguardians-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
    volumes:
      - ./db:/db:ro
    entrypoint: ["bash", "/db/migrate.sh"]
    networks:
      - bioguardians-network

  backend:
    image: ${IMAGE:?IMAGE is required}-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: bioguardians-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CACHE_MAX: ${CACHE_MAX:-100}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-30000}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGIN: ${FRONTEND_URL:?FRONTEND_URL is required}
      GBIF_API_BASE: https://api.gbif.org/v1
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bioguardians-network
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1"

  frontend:
    image: ${IMAGE:?IMAGE is required}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: bioguardians-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - bioguardians-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: bioguardians-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - bioguardians-network
    profiles: [observability]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: bioguardians-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bioguardians_prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=168h
      - --storage.tsdb.path=/prometheus
    networks:
      - bioguardians-network
    profiles: [observability]
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"

  tempo:
    image: grafana/tempo:2.6.0
    container_name: bioguardians-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml:ro
      - bioguardians_tempo:/var/tempo
    networks:
      - bioguardians-network
    profiles: [observability]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  loki:
    image: grafana/loki:3.3.0
    container_name: bioguardians-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - bioguardians_loki:/loki
    networks:
      - bioguardians-network
    profiles: [observability]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: bioguardians-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bioguardians-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bioguardians_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - bioguardians-network
    depends_on:
      - prometheus
      - tempo
      - loki
    profiles: [observability]
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"

networks:
  bioguardians-network:
    driver: bridge

volumes:
  bioguardians_mysqldata:
    name: bioguardians_mysqldata
  bioguardians_prometheus:
  bioguardians_tempo:
  bioguardians_loki:
  bioguardians_grafana:
